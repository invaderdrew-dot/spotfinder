<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo status</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .checks { list-style: none; padding: 0; display: grid; gap: 10px; max-width: 640px; }
    .checks li { display: grid; grid-template-columns: 28px 1fr; gap: 2px 10px; padding: 14px 16px; }
    .checks .icon { grid-row: span 2; font-size: 1.2rem; }
    .checks .ok .icon { color: #2e9d5b; }
    .checks .bad .icon { color: #c0392b; }
    .checks .optional .icon { color: var(--warn); }
    .verdict { font-size: 1.2rem; font-weight: 700; margin: 8px 0 20px; }
  </style>
</head>
<body>
  <!-- Owner: Andrew. Open right before judging: every row should be green. -->
  <main>
    <h1>Demo status</h1>
    <p class="verdict" id="verdict">Checking everything…</p>
    <ul class="checks" id="checks"></ul>
    <p class="muted small" id="when"></p>
    <button class="primary" id="again">Check again</button>
    <a class="ghost" href="/" style="margin-left: 16px">Open the app →</a>
  </main>
  <script type="module">
    import { esc } from "/proposal.js";

    async function check() {
      document.getElementById("verdict").textContent = "Checking everything…";
      try {
        const s = await fetch("/api/status").then((r) => r.json());
        const blocking = s.checks.filter((c) => !c.ok && !c.optional);
        document.getElementById("verdict").textContent = blocking.length
          ? `${blocking.length} thing${blocking.length > 1 ? "s" : ""} to fix before the demo`
          : "Ready to demo ✓";
        document.getElementById("checks").innerHTML = s.checks
          .map((c) => {
            const cls = c.ok ? "ok" : c.optional ? "optional" : "bad";
            return `<li class="card ${cls}"><span class="icon">${c.ok ? "✓" : c.optional ? "○" : "✗"}</span><strong>${esc(c.name)}</strong><span class="muted">${esc(c.detail)}</span></li>`;
          })
          .join("");
        document.getElementById("when").textContent = `Checked ${new Date(s.checkedAt).toLocaleTimeString()} in ${s.seconds}s. Results are cached for a minute.`;
      } catch {
        document.getElementById("verdict").textContent = "✗ The server isn't responding. Is the app running?";
      }
    }
    document.getElementById("again").onclick = check;
    check();
  </script>
</body>
</html>
