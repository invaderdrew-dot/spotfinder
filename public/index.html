<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spot Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- OWNER: Teammate 1 (frontend). Four screens, only one visible at a time. -->
  <header class="topbar">
    <span class="brand">Spot Finder</span>
    <span class="tagline">From moodboard to shoot-ready proposal</span>
  </header>

  <!-- SCREEN 1 -->
  <section id="screen-brief" class="screen active">
    <h1>Let's find your perfect shot.</h1>
    <p class="sub">Drop in 1–3 of your client's inspiration photos and pick a shoot date.</p>
    <form id="brief-form">
      <label class="drop" id="drop">
        <input type="file" id="photos" name="photos" accept="image/*" multiple hidden />
        <span id="drop-text">Click or drag inspiration photos here</span>
        <div id="previews" class="previews"></div>
      </label>
      <div class="row">
        <label>Shoot date <input type="date" id="date" required /></label>
        <button type="submit" class="cta">Find My Spots</button>
      </div>
    </form>
  </section>

  <!-- SCREEN 2 -->
  <section id="screen-matches" class="screen">
    <h1>We found your next backdrop.</h1>
    <p class="sub" id="summary"></p>
    <div id="chips" class="chips"></div>
    <div id="cards" class="cards"></div>
    <button class="ghost" data-go="screen-brief">← New brief</button>
  </section>

  <!-- SCREEN 3 -->
  <section id="screen-plan" class="screen">
    <h1>Your vision, mapped out.</h1>
    <div id="plan"></div>
    <div class="row pricing">
      <label>Client name <input id="client" placeholder="Jordan" /></label>
      <label>Hourly rate ($) <input id="rate" type="number" min="0" placeholder="150" /></label>
      <label>Hours <input id="hours" type="number" min="0" step="0.5" placeholder="2" /></label>
    </div>
    <div class="row">
      <button class="ghost" data-go="screen-matches">← Back to matches</button>
      <button class="cta" id="make-proposal">Generate Client Proposal</button>
    </div>
  </section>

  <!-- SCREEN 4 -->
  <section id="screen-proposal" class="screen">
    <div class="no-print row">
      <button class="ghost" data-go="screen-plan">← Edit plan</button>
      <button class="cta" onclick="window.print()">Print / Save as PDF</button>
    </div>
    <article id="proposal" class="proposal"></article>
  </section>

  <div id="loading" class="loading" hidden><div class="spinner"></div><p id="loading-text">Reading your moodboard…</p></div>
  <script src="app.js"></script>
</body>
</html>
