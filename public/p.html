<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Shoot proposal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/font/lucide.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Owner: Andrew. The client-facing page a share link opens. -->
  <header class="topbar no-print"><div class="topbar-inner"><span class="brand">Spot Finder</span></div></header>
  <main class="screen narrow">
    <article class="doc" id="doc"><p class="doc-body">Opening proposal…</p></article>
    <p class="muted small no-print" id="privacy">This proposal lives only in its link. Nothing is stored on a server.</p>
  </main>
  <script type="module">
    import { readShareLink } from "/share.js";
    import { proposalHTML, icon } from "/proposal.js";
    import { wireListenButton, stopNarration } from "/narrate.js";

    const ACTIONS = `
      <button class="pill" id="listenBtn"><span class="label">Listen to this proposal</span><span class="dot">${icon("play")}</span></button>
      <button class="pill outline" id="printBtn"><span class="label">Print / PDF</span><span class="dot">${icon("printer")}</span></button>`;

    async function render() {
      stopNarration();
      const p = await readShareLink(location.hash);
      const doc = document.getElementById("doc");
      if (!p) {
        doc.innerHTML = `<div class="doc-body"><h1>This link doesn't work</h1><p class="muted">It may have been cut off when it was copied. Ask your photographer to send it again.</p></div>`;
        document.getElementById("privacy").hidden = true;
        return;
      }
      document.getElementById("privacy").hidden = false;
      document.title = `Shoot proposal · ${p.clientName || "Client"}`;
      doc.innerHTML = proposalHTML(p, { actions: ACTIONS });
      wireListenButton(document.getElementById("listenBtn"), () => p);
      document.getElementById("printBtn").addEventListener("click", () => window.print());
    }
    render();
    window.addEventListener("hashchange", render);
  </script>
</body>
</html>
